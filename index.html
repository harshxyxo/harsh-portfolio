<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harsh Sharma — Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Harsh Sharma, a software developer and B.Tech Computer Science student building full-stack web applications, APIs and applied AI projects."
    />
    <meta name="author" content="Harsh Sharma" />
    <meta name="theme-color" content="#f7f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harsh Sharma — Software Developer" />
    <meta
      property="og:description"
      content="Portfolio of Harsh Sharma, a software developer and B.Tech Computer Science student building full-stack web applications, APIs and applied AI projects."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Harsh Sharma — Software Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Harsh Sharma, a software developer and B.Tech Computer Science student building full-stack web applications, APIs and applied AI projects."
    />
    <script>
      // Resolve the theme before first paint so the page never flashes the wrong palette.
      try {
        var storedTheme = localStorage.getItem('portfolio-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : prefersDark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
